name: Full Stack E2E Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  backend-e2e:
    runs-on: ubuntu-latest
    name: Backend E2E Tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hotel_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3307:3306

      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 27017:27017

    steps:
      - name: Checkout Backend Code
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize MySQL Schema
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          until mysqladmin ping -h 127.0.0.1 -P 3307 -u root -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          mysql -h 127.0.0.1 -P 3307 -u root -proot hotel_db < backend/sql/01_database_create.sql
          mysql -h 127.0.0.1 -P 3307 -u root -proot hotel_db < backend/sql/02_test_data.sql
          mysql -h 127.0.0.1 -P 3307 -u root -proot hotel_db < backend/sql/03_logic.sql

      - name: Run Backend E2E Tests
        run: cd backend && ./mvnw test -Dtest='*E2E*' --no-transfer-progress
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3307
          MYSQL_DATABASE: hotel_db
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017

  frontend-e2e:
    runs-on: ubuntu-latest
    name: Frontend E2E Tests
    needs: backend-e2e

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          repository: sophus-ingi/HotelManagementFrontend
          path: frontend

      - name: Checkout Backend Code
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Start Backend Service
        run: |
          cd backend
          ./mvnw spring-boot:run -DskipTests &
          sleep 30
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306

      - name: Install Frontend Dependencies
        run: cd frontend && npm install

      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps

      - name: Run Frontend E2E Tests
        run: cd frontend && npm test
        env:
          CI: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  integration-summary:
    runs-on: ubuntu-latest
    name: E2E Integration Status
    needs: [backend-e2e, frontend-e2e]
    if: always()

    steps:
      - name: Report Results
        run: |
          echo "✅ Backend E2E Tests: ${{ needs.backend-e2e.result }}"
          echo "✅ Frontend E2E Tests: ${{ needs.frontend-e2e.result }}"
          echo ""
          echo "Full Stack E2E Test Suite Completed"
