# Test Configuration - Spring Boot Test Properties
# This file is used for @TestPropertySource and integration tests

# Server
server.port=8080
server.servlet.context-path=/

# Database - H2 In-Memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# MongoDB - Fast timeout for tests
spring.data.mongodb.uri=mongodb://invalid:27017/test?serverSelectionTimeoutMS=100
spring.data.mongodb.auto-index-creation=false

# Neo4j & MongoDB - Disabled for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.neo4j.DataNeo4jAutoConfiguration,org.springframework.boot.autoconfigure.data.neo4j.DataNeo4jReactiveAutoConfiguration,org.springframework.boot.autoconfigure.data.mongodb.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongodb.MongoRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.mongodb.MongoAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

# JWT Configuration
app.jwt.secret=test-secret-key-that-is-long-enough-for-hs512-and-more-test-secret-key-long-secure-key
app.jwt.expiration=86400000

# Logging
logging.level.root=WARN
logging.level.com.kea.hotel.hotelbackend=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Test Settings
spring.test.mockmvc.print=true
spring.test.database.replace=any

# Disable unnecessary initializers
spring.jpa.defer-datasource-initialization=true
