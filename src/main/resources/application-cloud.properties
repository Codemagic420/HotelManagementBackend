# ============================================
# Cloud Deployment Configuration
# For: Railway MySQL, MongoDB Atlas, Neo4j Aura
# Activate with: SPRING_PROFILES_ACTIVE=cloud
# ============================================

# ============================================
# MySQL Configuration (Railway)
# ============================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hotel_db}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ============================================
# MongoDB Configuration (MongoDB Atlas)
# Uses mongodb+srv:// protocol for cloud
# ============================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://admin:admin123@cluster0.mongodb.net/hotel_db?retryWrites=true&w=majority}
spring.data.mongodb.database=${MONGODB_DATABASE:hotel_db}

# ============================================
# Neo4j Configuration (Neo4j Aura)
# Uses neo4j+s:// protocol for secure cloud connections
# ============================================
spring.neo4j.uri=${SPRING_NEO4J_URI:neo4j+s://abc123.databases.neo4j.io}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:yourpassword}
spring.neo4j.connection-timeout=30s

# ============================================
# Logging (Cloud)
# ============================================
logging.level.root=WARN
logging.level.com.kea.hotel.hotelbackend=INFO
logging.level.org.springframework.web=INFO

# ============================================
# Swagger UI
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# AI Service (Optional)
# ============================================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
