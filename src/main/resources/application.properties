# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/hotel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# MongoDB
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://admin:admin123@localhost:27017/hotel_db?authSource=admin}
spring.mongodb.database=hotel_db

# Neo4j
spring.neo4j.uri=${SPRING_NEO4J_URI:neo4j://localhost:7687}
spring.neo4j.authentication.username=${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
spring.neo4j.authentication.password=${SPRING_NEO4J_AUTHENTICATION_PASSWORD:yourpassword}

# Swagger UI
springdoc.swagger-ui.path=/swaggerui.html

# AI Enrichment (Ollama)
ai.ollama.url=${AI_OLLAMA_URL:http://localhost:11434}
ai.ollama.model=${AI_OLLAMA_MODEL:mistral:7b}
