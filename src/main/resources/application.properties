# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hotel_db}
spring.datasource.username=${MYSQL_ROOT_USERNAME:admin}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB
spring.mongodb.uri=mongodb://${MONGODB_USER:admin}:${MONGODB_PASSWORD:admin123}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:hotel_db}?authSource=admin
spring.mongodb.database=hotel_db

# Neo4j
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=${NEO4J_PASSWORD:secure_neo4j_password_dev}

# LLM Assistant proxy (FastAPI service)
app.llm.base-url=${LLM_BASE_URL:http://localhost:8000}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

