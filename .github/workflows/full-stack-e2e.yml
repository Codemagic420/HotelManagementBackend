name: Full Stack E2E Tests

on:
  push:
    branches: [ master, develop, examasger ]
  pull_request:
    branches: [ master, develop, examasger ]

jobs:
  full-stack-e2e:
    runs-on: ubuntu-latest
    name: Build, Run, and Test Full Stack

    # 1. Spin up the databases for this specific runner
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hotel_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3307:3306

      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 27017:27017

    steps:
      # 2. Checkout BOTH repositories onto the same machine
      - name: Checkout Backend Code
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          repository: sophus-ingi/HotelManagementFrontend
          token: ${{ secrets.GH_PAT }}
          path: frontend

      # 3. Setup the environments (Java & Node)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 4. Prepare Database Schema
      - name: Initialize MySQL Schema
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          until mysqladmin ping -h 127.0.0.1 -P 3307 -u root -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          mysql -h 127.0.0.1 -P 3307 -u root -proot hotel_db < backend/sql/01_database_create.sql
          mysql -h 127.0.0.1 -P 3307 -u root -proot hotel_db < backend/sql/02_test_data.sql
          mysql -h 127.0.0.1 -P 3307 -u root -proot hotel_db < backend/sql/03_logic.sql

      # 5. Start the Backend in the background
      - name: Start Backend Service
        run: |
          cd backend
          ./mvnw spring-boot:run -DskipTests &
          
          # Give it time to boot up before tests start
          sleep 45 
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3307 # Make sure this matches the service port above!
          MYSQL_DATABASE: hotel_db
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017

      # 6. Install Frontend & Playwright
      - name: Install Frontend Dependencies
        run: cd frontend && npm install

      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps

      # 7. Run the actual E2E Tests
      - name: Run Frontend E2E Tests
        run: cd frontend && npm test
        env:
          CI: true

      # 8. Save the report if it fails
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30