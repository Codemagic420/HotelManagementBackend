name: k6 Load Test

on:
  workflow_dispatch: {}

jobs:
  build-and-load-test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:8080' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build project
        run: |
          ./mvnw -DskipTests package --batch-mode

      - name: Start application
        run: |
          nohup ./mvnw -DskipTests spring-boot:run > app.log 2>&1 &
          echo $! > .app_pid

      - name: Wait for application health
        run: |
          for i in {1..60}; do
            if curl -sSf ${BASE_URL}/actuator/health >/dev/null; then
              echo "app is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for app" >&2
          cat app.log || true
          exit 1

      - name: Prepare artifacts directory
        run: mkdir -p artifacts/perf

      - name: Run k6 load test (Docker image)
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/scripts:/scripts \
            -v ${{ github.workspace }}/artifacts/perf:/out \
            -e BASE_URL=${{ env.BASE_URL }} \
            loadimpact/k6 run --out json=/out/result.json /scripts/load-test.js

      - name: Upload k6 result
        uses: actions/upload-artifact@v4
        with:
          name: k6-result
          path: artifacts/perf/result.json

      - name: Stop application
        if: always()
        run: |
          if [ -f .app_pid ]; then
            kill "$(cat .app_pid)" || true
          fi
          sleep 2

