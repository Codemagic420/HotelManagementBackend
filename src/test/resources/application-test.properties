# Test Configuration - Spring Boot Test Properties
# This file is used for @TestPropertySource and integration tests

# Server
server.port=8080
server.servlet.context-path=/

# Database - H2 In-Memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# MongoDB (embedded for tests - optional)
# Use testcontainers if needed
spring.data.mongodb.auto-index-creation=false

# Prevent tests from attempting to connect to an external MongoDB instance
# by excluding Mongo auto-configuration in the 'test' profile.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoReactiveAutoConfiguration

# Neo4j (testcontainers integration if needed)
# Commented out for basic test setup

# JWT Configuration
app.jwt.secret=test-secret-key-that-is-long-enough-for-hs512-and-more-test-secret-key-long-secure-key
app.jwt.expiration=86400000

# Logging
logging.level.root=WARN
logging.level.com.kea.hotel.hotelbackend=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Test Settings
spring.test.mockmvc.print=DEFAULT
spring.test.database.replace=any

# Disable unnecessary initializers
spring.jpa.defer-datasource-initialization=true

# Ensure SQL init (schema.sql) runs for tests
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
