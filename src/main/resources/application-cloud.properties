# ============================================
# Cloud Deployment Profile
# For Azure MySQL Server, MongoDB Atlas, and Neo4j AuraDB
# ============================================

# ============================================
# MySQL - Azure MySQL Server (Recommended)
# ============================================
# Format: jdbc:mysql://<SERVER-NAME>.mysql.database.azure.com:3306/hotel_db
# Example: jdbc:mysql://hotel-db-server.mysql.database.azure.com:3306/hotel_db
# Note: Azure MySQL requires useSSL=true for secure connections
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ============================================
# MongoDB - MongoDB Atlas
# ============================================
# Format: mongodb+srv://<USERNAME>:<PASSWORD>@<CLUSTER>.mongodb.net/hotel_db
# Example: mongodb+srv://admin:password@hotel-cluster.abc123.mongodb.net/hotel_db
spring.mongodb.uri=${MONGODB_ATLAS_URI}
spring.mongodb.database=hotel_db

# ============================================
# Neo4j - Neo4j Aura (Cloud)
# ============================================
# Format: neo4j+s://<INSTANCE-ID>.databases.neo4j.io
# Example: neo4j+s://abc12345.databases.neo4j.io
spring.neo4j.uri=${NEO4J_AURA_URI}
spring.neo4j.authentication.username=${NEO4J_USER}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# ============================================
# AI Enrichment - Disabled in Production
# ============================================
# Set to DISABLED or remove Ollama reference in production
# If AI is needed, use a cloud-hosted LLM service instead
ai.ollama.url=DISABLED
ai.ollama.model=mistral:7b

# ============================================
# Logging
# ============================================
logging.level.root=WARN
logging.level.com.kea.hotel.hotelbackend=INFO
logging.level.org.springframework.web=INFO

# ============================================
# JPA/Hibernate
# ============================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# Swagger UI (optional - can be disabled in production)
# ============================================
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# Connection Pool Settings (for RDS)
# ============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
